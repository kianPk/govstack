<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GovStack</title>
<link rel="stylesheet" href="./style.css"/>
</head><body>
<div class="shell">
<header class="top"><div class="brand"><h1>GovStack</h1><p>Solidity · Foundry · lab demo</p></div><span class="chip" id="net">demo mode</span></header>
<section class="hero"><p class="kicker">DAO governor + timelock</p><h2>Propose. Vote. Queue. Execute treasury spends on-chain.</h2></section>
<section class="kpis" id="kpis"></section>
<div class="layout">
<aside class="panel"><h3>Proposal</h3>
<label>Grant ETH<input id="grant" type="number" value="1" step="0.1"/></label>
<label>Alice votes %<input id="alice" type="number" value="60"/></label>
<div id="actions"></div></aside>
<section class="panel"><h3>Event log</h3><pre class="log" id="log"></pre></section>
</div>
<footer><span>kianPk / govstack</span><a href="https://github.com/kianPk/govstack" target="_blank" rel="noopener">source</a></footer>
</div>
<script src="./app.js"></script>
</body></html>
